<!-- =========================================
CARD 1 : PATIENT & VASOPRESSIN INDICATION
========================================= -->

<div class="bg-slate-800 rounded-xl border border-slate-700 p-5 shadow-lg">

  <h2 class="text-base font-bold text-sky-400 border-b border-slate-700 pb-2 mb-4">

    🏥 Patient & Vasopressin Indication

  </h2>

  <div class="space-y-3">

    <div>

      <label class="block text-xs font-medium text-slate-300 mb-1">
        Patient Name
      </label>

      <input
        id="patient-name"
        type="text"
        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

    </div>

    <div class="grid grid-cols-2 gap-3">

      <div>

        <label class="block text-xs font-medium text-slate-300 mb-1">
          MRN / RN
        </label>

        <input
          id="mrn"
          type="text"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

      </div>

      <div>

        <label class="block text-xs font-medium text-slate-300 mb-1">
          Weight (kg)
        </label>

        <input
          id="weight"
          type="number"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

      </div>

    </div>

    <div>

      <label class="block text-xs font-medium text-slate-300 mb-1">
        Diagnosis
      </label>

      <input
        id="diagnosis"
        type="text"
        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

    </div>

    <div class="bg-slate-900 border border-slate-700 rounded-lg p-3">

      <div class="text-xs font-bold text-sky-300 mb-3">

        Reason Vasopressin Started

      </div>

      <div class="space-y-2 text-sm">

        <label class="flex items-center gap-2">
          <input type="checkbox" id="vp-ne025">
          NE > 0.25 mcg/kg/min
        </label>

        <label class="flex items-center gap-2">
          <input type="checkbox" id="vp-rv">
          RV Dysfunction
        </label>

        <label class="flex items-center gap-2">
          <input type="checkbox" id="vp-vasoplegia">
          Vasoplegic Shock
        </label>

        <label class="flex items-center gap-2">
          <input type="checkbox" id="vp-other">
          Other
        </label>

      </div>

      <textarea
        id="vp-other-text"
        rows="2"
        placeholder="Specify indication..."
        class="mt-3 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">
      </textarea>

    </div>

    <div class="grid grid-cols-2 gap-3">

      <div>

        <label class="block text-xs font-medium text-slate-300 mb-1">
          Target MAP
        </label>

        <input
          id="target-map"
          type="number"
          value="65"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

      </div>

      <div>

        <label class="block text-xs font-medium text-slate-300 mb-1">
          Time To Target MAP (hours)
        </label>

        <input
          id="time-map"
          type="number"
          step="0.1"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

      </div>

    </div>

    <div>

      <label class="block text-xs font-medium text-slate-300 mb-1">
        Target MAP Achieved
      </label>

      <select
        id="map-achieved"
        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

        <option>Yes</option>
        <option>No</option>

      </select>

    </div>

  </div>

</div>
<!-- =========================================
CARD 2 : VASOPRESSOR & INOTROPE EXPOSURE
========================================= -->

<div class="bg-slate-800 rounded-xl border border-slate-700 p-5 shadow-lg">

  <h2 class="text-base font-bold text-emerald-400 border-b border-slate-700 pb-2 mb-4">

    💉 Vasopressor & Inotrope Exposure

  </h2>

  <!-- NORADRENALINE -->

  <div class="bg-slate-900 border border-slate-700 rounded-lg p-4 mb-4">

    <h3 class="font-bold text-sky-300 mb-3">
      Noradrenaline
    </h3>

    <div class="text-xs text-slate-400 mb-3">

      Standard Preparation:
      4 ampoules in 50mL syringe

    </div>

    <div class="grid grid-cols-2 gap-3">

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          Starting Dose
        </label>
        <input type="number" id="ne-start">
      </div>

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          Peak Dose
        </label>
        <input type="number" id="ne-peak">
      </div>

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          Before VP
        </label>
        <input type="number" id="ne-before-vp">
      </div>

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          1h After VP
        </label>
        <input type="number" id="ne-1h">
      </div>

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          6h After VP
        </label>
        <input type="number" id="ne-6h">
      </div>

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          24h After VP
        </label>
        <input type="number" id="ne-24h">
      </div>

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          48h After VP
        </label>
        <input type="number" id="ne-48h">
      </div>

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          72h After VP
        </label>
        <input type="number" id="ne-72h">
      </div>

    </div>

    <hr class="my-4 border-slate-700">

    <div class="grid grid-cols-2 gap-3">

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          Syringes First 72h
        </label>
        <input type="number" id="ne-syringe-72">
      </div>

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          Syringes Entire Stay
        </label>
        <input type="number" id="ne-syringe-total">
      </div>

    </div>

    <div class="grid grid-cols-3 gap-3 mt-3">

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          Cost / Day (RM)
        </label>
        <input readonly id="ne-daily-cost">
      </div>

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          Cost First 72h (RM)
        </label>
        <input readonly id="ne-cost-72">
      </div>

      <div>
        <label class="block text-xs text-slate-300 mb-1">
          Total Cost (RM)
        </label>
        <input readonly id="ne-cost-total">
      </div>

    </div>

  </div>

  <!-- VASOPRESSIN -->

  <div class="bg-slate-900 border border-slate-700 rounded-lg p-4 mb-4">

    <h3 class="font-bold text-purple-300 mb-3">
      Vasopressin
    </h3>

    <div class="text-xs text-slate-400 mb-3">

      Standard Preparation:
      20 units in 20mL syringe

    </div>

    <div class="grid grid-cols-2 gap-3">

      <div>
        <label>Starting Dose</label>
        <input type="number" id="vp-start">
      </div>

      <div>
        <label>Peak Dose</label>
        <input type="number" id="vp-peak">
      </div>

      <div>
        <label>Final Dose</label>
        <input type="number" id="vp-final">
      </div>

      <div>
        <label>Duration (days)</label>
        <input type="number" id="vp-days">
      </div>

    </div>

    <hr class="my-4 border-slate-700">

    <div class="grid grid-cols-2 gap-3">

      <div>
        <label>Syringes First 72h</label>
        <input type="number" id="vp-syringe-72">
      </div>

      <div>
        <label>Syringes Entire Stay</label>
        <input type="number" id="vp-syringe-total">
      </div>

    </div>

    <div class="grid grid-cols-3 gap-3 mt-3">

      <div>
        <label>Cost / Day (RM)</label>
        <input readonly id="vp-daily-cost">
      </div>

      <div>
        <label>Cost First 72h (RM)</label>
        <input readonly id="vp-cost-72">
      </div>

      <div>
        <label>Total Cost (RM)</label>
        <input readonly id="vp-cost-total">
      </div>

    </div>

  </div>

  <!-- OTHER INOTROPES -->

  <div class="bg-slate-900 border border-slate-700 rounded-lg p-4">

    <h3 class="font-bold text-amber-300 mb-3">
      Other Inotropes
    </h3>

    <div class="grid grid-cols-2 gap-4">

      <div>

        <label>Dobutamine Used?</label>

        <select id="dobu-used">
          <option>No</option>
          <option>Yes</option>
        </select>

        <label class="mt-2 block">
          Peak Dose
        </label>

        <input type="number">

      </div>

      <div>

        <label>Adrenaline Used?</label>

        <select id="adre-used">
          <option>No</option>
          <option>Yes</option>
        </select>

        <label class="mt-2 block">
          Peak Dose
        </label>

        <input type="number">

      </div>

    </div>

  </div>

</div>
