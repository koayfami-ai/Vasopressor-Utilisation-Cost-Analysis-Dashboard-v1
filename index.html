<!-- =========================================
CARD 1 : PATIENT & VASOPRESSIN INDICATION
========================================= -->

<div class="bg-slate-800 rounded-xl border border-slate-700 p-5 shadow-lg">

  <h2 class="text-base font-bold text-sky-400 border-b border-slate-700 pb-2 mb-4">

    🏥 Patient & Vasopressin Indication

  </h2>

  <div class="space-y-3">

    <div>

      <label class="block text-xs font-medium text-slate-300 mb-1">
        Patient Name
      </label>

      <input
        id="patient-name"
        type="text"
        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

    </div>

    <div class="grid grid-cols-2 gap-3">

      <div>

        <label class="block text-xs font-medium text-slate-300 mb-1">
          MRN / RN
        </label>

        <input
          id="mrn"
          type="text"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

      </div>

      <div>

        <label class="block text-xs font-medium text-slate-300 mb-1">
          Weight (kg)
        </label>

        <input
          id="weight"
          type="number"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

      </div>

    </div>

    <div>

      <label class="block text-xs font-medium text-slate-300 mb-1">
        Diagnosis
      </label>

      <input
        id="diagnosis"
        type="text"
        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

    </div>

    <div class="bg-slate-900 border border-slate-700 rounded-lg p-3">

      <div class="text-xs font-bold text-sky-300 mb-3">

        Reason Vasopressin Started

      </div>

      <div class="space-y-2 text-sm">

        <label class="flex items-center gap-2">
          <input type="checkbox" id="vp-ne025">
          NE > 0.25 mcg/kg/min
        </label>

        <label class="flex items-center gap-2">
          <input type="checkbox" id="vp-rv">
          RV Dysfunction
        </label>

        <label class="flex items-center gap-2">
          <input type="checkbox" id="vp-vasoplegia">
          Vasoplegic Shock
        </label>

        <label class="flex items-center gap-2">
          <input type="checkbox" id="vp-other">
          Other
        </label>

      </div>

      <textarea
        id="vp-other-text"
        rows="2"
        placeholder="Specify indication..."
        class="mt-3 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">
      </textarea>

    </div>

    <div class="grid grid-cols-2 gap-3">

      <div>

        <label class="block text-xs font-medium text-slate-300 mb-1">
          Target MAP
        </label>

        <input
          id="target-map"
          type="number"
          value="65"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

      </div>

      <div>

        <label class="block text-xs font-medium text-slate-300 mb-1">
          Time To Target MAP (hours)
        </label>

        <input
          id="time-map"
          type="number"
          step="0.1"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

      </div>

    </div>

    <div>

      <label class="block text-xs font-medium text-slate-300 mb-1">
        Target MAP Achieved
      </label>

      <select
        id="map-achieved"
        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100">

        <option>Yes</option>
        <option>No</option>

      </select>

    </div>

  </div>

</div>
